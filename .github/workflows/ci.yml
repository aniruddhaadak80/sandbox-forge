name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # This job exists so branch protection can require a check by this exact name. The
      # scheduled gitleaks workflow covers the same ground on a slower cadence.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  policy:
    name: Policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:skill-version
      - run: npm run check:no-secrets
      - run: npm run check:theme-tokens
      - run: npm run check:boundaries
      - run: npm run check:public-hygiene
      - run: npm run check:readme-commands
      # The web app's copy of the taxonomy and the certificate is a build
      # artefact (ADR 0003), and this gate is what keeps it honest: it fails
      # when the committed copy has drifted from its source.
      - run: npm run check:web-data

  test:
    name: Test
    needs: [format, lint, typecheck, policy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  pytest:
    name: Python test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          # The engine's dependencies live in services/engine, not at the root,
          # so the cache key is taken from that pyproject. The npm side of this
          # job was already cached; the pip side was re-downloaded on every run,
          # on two Python versions.
          cache: pip
          cache-dependency-path: services/engine/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "services/engine[dev]"
      - run: python -m pytest services/engine -q
      - run: python -m mypy --strict services/engine/src
      - run: python -m ruff check services/engine

  build:
    name: Build
    needs: [test, pytest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the web app
        run: npm run build --workspace @sandboxforge/web
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 7

  doctor:
    name: Doctor and MCP smoke test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: sandbox-forge doctor must exit 0
        run: node packages/cli/dist/bin.js doctor
      - name: the committed certificate must still be reproducible
        run: |
          digest=$(node packages/cli/dist/bin.js plan \
            taxonomies/asi-control-baseline.json --budget 8 --seed 20261005 --json \
            | python -c "import json,sys;print(json.load(sys.stdin)['certificate_digest'])")
          expected=$(python -c "
          import json;print(json.load(open('certificates/4191b5b1-b8-s20261005.json'))['certificate_digest'])")
          echo "recomputed=$digest committed=$expected"
          test "$digest" = "$expected"
      - name: MCP must really speak MCP
        run: node e2e/mcp-proof.mjs
