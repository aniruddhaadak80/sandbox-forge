name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump kind
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# Never cancel a production release partway through.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bump every manifest
        run: node scripts/release.mjs ${{ inputs.bump }}
      - name: Full gate against the bumped tree
        run: npm run check
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): $VERSION" || echo "no version changes"
          git tag -f "$(node -p "require('./package.json').version")"
      - name: Push
        run: git push --follow-tags
